<!DOCTYPE html>
<html lang="ja">
<head>
        <script>
        // GLOBAL ERROR CAPTURER / PWA SELF-HEALING ENGINE (RELOAD LOOPS PREVENTED)
        window.addEventListener('error', function(e) {
            console.error("Fatal PWA Script Error detected: ", e.message);
            // If we hit a script loading error that causes black screen, reset cache
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (let r of registrations) {
                        r.unregister();
                    }
                    caches.keys().then(keys => {
                        for (let k of keys) caches.delete(k);
                    });
                    localStorage.clear();
                    console.log("Self-healing: Cache cleared. Reloading disabled to prevent loops.");
                });
            }
        });

        // ULTIMATE INSTANT CACHE RESET HANDLER v24
        if ('serviceWorker' in navigator && !localStorage.getItem('ultimate_reset_v24')) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                let hadRegistrations = false;
                for (let r of registrations) {
                    r.unregister();
                    hadRegistrations = true;
                }
                localStorage.setItem('ultimate_reset_v24', 'true');
                if (hadRegistrations) {
                    caches.keys().then(keys => {
                        for (let k of keys) caches.delete(k);
                    });
                    console.log("Stuck PWA Cache destroyed instantly. Reloading...");
                    window.location.reload();
                }
            });
        }
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#242424">
    <title>OUR TRAVELS | 旅のしおり</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Shippori+Gothic:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="images/header_shikoku.png">
    <link rel="stylesheet" href="src/enhancements.css?v=23">
    <link rel="stylesheet" href="src/shiori_styles.css?v=25">


    <style>
        :root {
            --font-bebas: 'Bebas Neue', sans-serif;
            --font-mont: 'Montserrat', sans-serif;
            --font-gothic: 'Shippori Gothic', sans-serif;

            --bg-body: #1c1c1c;
            --bg-card: #242424;
            --border-line: #383838;
            --border-highlight: #ffffff;

            --text-main: #ffffff;
            --text-sub: #a1a1a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-gothic);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.75;
            padding-bottom: 60px;
            overflow-x: hidden;
        }
        
        .l-container { width: 100%; max-width: 540px; margin: 0 auto; padding: 0 20px; position: relative; }

        /* Jillion Side Mark Brackets */
        .c-mark-left, .c-mark-right {
            position: fixed; top: 0; bottom: 0; width: 12px; z-index: 50; pointer-events: none; opacity: 0.25;
        }
        .c-mark-left { left: 6px; border-left: 1px solid #fff; border-top: 1px solid #fff; border-bottom: 1px solid #fff; }
        .c-mark-right { right: 6px; border-right: 1px solid #fff; border-top: 1px solid #fff; border-bottom: 1px solid #fff; }

        /* Portal Title Page Styles */
        .portal-view {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .portal-view.fade {
            opacity: 0;
            transform: translateY(10px);
        }
        .portal-view.show {
            opacity: 1;
            transform: translateY(0);
        }
        .db-header {
            padding: 80px 0 40px;
            border-bottom: 1px solid var(--border-line);
            margin-bottom: 40px;
            text-align: center;
        }
        .db-title {
            font-family: var(--font-bebas);
            font-size: 4.8rem;
            letter-spacing: 4px;
            line-height: 0.85;
            margin-bottom: 12px;
            font-weight: 400;
        }
        .db-subtitle {
            font-family: var(--font-mont);
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-sub);
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .db-section-title {
            font-family: var(--font-mont);
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--text-sub);
            margin-bottom: 24px;
            text-transform: uppercase;
            border-left: 2px solid #fff;
            padding-left: 12px;
        }
        .db-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }
        .db-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 30px 24px;
            position: relative;
            cursor: pointer;
            transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .db-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .db-card-date {
            font-family: var(--font-mont);
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--text-sub);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .db-card-title {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .db-card-sub {
            font-family: var(--font-mont);
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-sub);
            text-transform: uppercase;
        }
        .db-empty {
            border: 1px dashed var(--border-line);
            padding: 50px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* In-App Trip Selector Dropdown Modal */
        .title-select-container {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .title-select-arrow {
            font-size: 0.8rem;
            margin-left: 10px;
            color: var(--text-sub);
            transition: transform 0.2s ease;
        }
        .title-select-container:hover .title-select-arrow {
            color: #fff;
        }
        .trip-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #242424;
            border: 1px solid var(--border-line);
            z-index: 1000;
            min-width: 260px;
            display: none;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            margin-top: 8px;
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .trip-dropdown-menu.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .trip-dropdown-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-line);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .trip-dropdown-item:last-child {
            border-bottom: none;
        }
        .trip-dropdown-item:hover {
            background: #333333;
        }
        .trip-dropdown-item-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }
        .trip-dropdown-item-sub {
            font-family: var(--font-mont);
            font-size: 0.65rem;
            color: var(--text-sub);
            letter-spacing: 1px;
        }
        .trip-dropdown-portal-link {
            border-top: 1px solid var(--border-line);
            background: #1c1c1c;
            text-align: center;
            font-family: var(--font-mont);
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 14px 20px;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .trip-dropdown-portal-link:hover {
            color: #fff;
        }

        /* Detail View Styles */
        .trip-view {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .trip-view.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="c-mark-left"></div>
    <div class="c-mark-right"></div>

    <!-- 1. PORTAL TITLE SCREEN (Index List View) -->
    <div id="view-dashboard" class="portal-view l-container">
        <header class="db-header">
            <h1 class="db-title">OUR JOURNEYS</h1>
            <p class="db-subtitle">TRAVEL SHIORI ENGINE</p>
        </header>

        <h2 class="db-section-title">Select Trip Plan</h2>
        <div id="trips-container" class="db-grid">
            <div class="db-empty">Loading trip indexes...</div>
        </div>
    </div>

    <!-- 2. TRIP DETAIL ENGINE VIEW -->
    <div id="view-trip" class="trip-view" style="display: none;">
        <div id="trip-engine-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module">
        // Routing runs IMMEDIATELY — no await blocking
        const params = new URLSearchParams(window.location.search);
        const tripId = params.get('trip');

        if (tripId) {
            loadTripEngine(tripId, false);
        } else {
            loadDashboard(false);
        }

        // Bind back/forward browser button navigation
        window.addEventListener('popstate', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const currentId = urlParams.get('trip');
            if (currentId) {
                loadTripEngine(currentId, true);
            } else {
                loadDashboard(true);
            }
        });

        // Firebase sync loads in background — non-blocking
        import('./src/firebase-sync.js?v=25')
            .then(mod => { window._initSyncEngine = mod.initSyncEngine; })
            .catch(e => console.warn('Firebase sync unavailable:', e.message));

        // Load Portal Page (Title Screen)
        function loadDashboard(isPopState = false) {
            const view = document.getElementById('view-dashboard');
            document.getElementById('view-trip').style.display = 'none';
            view.style.display = 'block';
            setTimeout(() => view.classList.add('show'), 50);

            if (!isPopState) {
                history.pushState(null, '', './');
            }

            // Clear countdown/weather intervals if returning to dashboard
            if (window.countdownInterval) {
                clearInterval(window.countdownInterval);
                window.countdownInterval = null;
            }
            if (window.weatherInterval) {
                clearInterval(window.weatherInterval);
                window.weatherInterval = null;
            }
            if (window.nowModeInterval) {
                clearInterval(window.nowModeInterval);
                window.nowModeInterval = null;
            }

            fetch('data/trips.json')
                .then(res => res.json())
                .then(trips => {
                    const container = document.getElementById('trips-container');
                    container.innerHTML = '';
                    if (trips.length === 0) {
                        container.innerHTML = '<div class="db-empty">No active trip configurations found.</div>';
                        return;
                    }
                    trips.forEach(t => {
                        const card = document.createElement('div');
                        card.className = 'db-card';
                        card.innerHTML = `
                            <div class="db-card-date">${t.date.replace(/-/g, '/')}</div>
                            <div class="db-card-title">${t.title}</div>
                            <div class="db-card-sub">${t.subtitle}</div>
                        `;
                        card.addEventListener('click', () => {
                            view.classList.remove('show');
                            setTimeout(() => {
                                loadTripEngine(t.id, false);
                            }, 300);
                        });
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('trips-container').innerHTML = 
                        '<div class="db-empty" style="color: #ff6b6b;">Error loading trip config.</div>';
                });
        }

        // Load Shiori Detail Page
        function loadTripEngine(tripId, isPopState = false) {
            const view = document.getElementById('view-trip');
            document.getElementById('view-dashboard').style.display = 'none';
            view.style.display = 'block';

            if (!isPopState) {
                history.pushState(null, '', `./?trip=${tripId}`);
            }

            // Tear down old Leaflet map instance and DOM hooks if switching trips dynamically
            if (window.overviewMap && typeof window.overviewMap.remove === 'function') {
                try {
                    window.overviewMap.remove();
                    window.overviewMap = null;
                } catch(e) {}
            }
            
            // Clear existing intervals
            if (window.countdownInterval) clearInterval(window.countdownInterval);
            if (window.weatherInterval) clearInterval(window.weatherInterval);
            if (window.nowModeInterval) clearInterval(window.nowModeInterval);

            // Fetch and render
            fetch(`data/${tripId}.json`)
                .then(res => res.json())
                .then(data => {
                    buildShioriUI(data);
                    window.currentTripId = tripId;
                    window.currentTripDate = data.startDate;
                    
                    // Import enhancements logic after rendering DOM
                    const script = document.createElement('script');
                    script.src = `src/enhancements.js?v=${Date.now()}`;
                    document.body.appendChild(script);

                    // Initialize sync engine for specific Trip ID (loaded async in background)
                    if (typeof window._initSyncEngine === 'function') {
                        window._initSyncEngine(tripId);
                    }
                    
                    // Populate window.weatherLocations dynamically
                    window.weatherLocations = data.weatherLocations || {};
                    window.weatherCache = {};
                    
                    // Set up countdown values
                    window.currentTripStart = data.startDate + 'T06:55:00+09:00';
                    window.currentTripEnd = data.endDate + 'T21:20:00+09:00';
                    
                    // Build TRIP_ROUTES dynamically from JSON data
                    window.TRIP_ROUTES = {};
                    const colors = ['#59d9b0', '#ffbf47', '#73a7ff', '#ff7373', '#d959d9'];
                    const keys = Object.keys(data.days).sort();
                    
                    keys.forEach((dayKey, idx) => {
                        const stops = [];
                        data.days[dayKey].forEach(spot => {
                            if (spot.lat && spot.lon) {
                                stops.push({
                                    name: spot.title,
                                    coords: [spot.lat, spot.lon]
                                });
                            }
                        });
                        window.TRIP_ROUTES[dayKey] = {
                            color: colors[idx % colors.length],
                            ferryLegs: data.ferryLegs ? data.ferryLegs[dayKey] || [] : (dayKey === 'day1' && tripId === 'shikoku2026' ? [2, 7] : []), // Fallback to ferry legs for Shikoku Day1
                            stops: stops
                        };
                    });
                    
                    // Trigger initializers
                    setTimeout(() => {
                        const firstWKey = Object.keys(window.weatherLocations)[0];
                        if (firstWKey) {
                            window.setWeatherTab(firstWKey, document.querySelector('.w-tab.active'));
                        }
                        window.refreshWeather();
                        window.weatherInterval = setInterval(window.refreshWeather, 30 * 60 * 1000);
                        
                        window.initOverviewMap();
                        const firstDayKey = keys[0];
                        if (firstDayKey) {
                            window.filterOverviewMap(firstDayKey, document.querySelector(`[data-map-filter="${firstDayKey}"]`));
                        }
                        
                        window.setupDaySwipe();
                        
                        window.runCountdown();
                        window.countdownInterval = setInterval(window.runCountdown, 1000);
                        
                        window.moveFatherBeachCard();
                        window.moveDay1HotelCard();
                        window.moveTowelMuseumBeforeLunch();
                    }, 100);

                    setTimeout(() => view.classList.add('show'), 50);
                    setupInAppDropdown(tripId);
                })
                .catch(err => {
                    console.error("Error loading trip:", err);
                    container.innerHTML = `
                        <div class="l-container" style="padding: 100px 20px; text-align: center;">
                            <h2 style="color: #ff6b6b; margin-bottom: 20px;">Trip Plan Error</h2>
                            <p style="color: #a1a1a1;">Could not load trip data for "${tripId}".</p>
                            <a href="./" class="j-btn" style="margin-top: 20px; text-decoration: none;">Return to Home</a>
                        </div>
                    `;
                });
        }

        // Setup Dropdown selector for changing trips on the fly inside the Shiori view
        function setupInAppDropdown(currentId) {
            const container = document.getElementById('dropdown-trigger');
            if (!container) return;
            
            const menu = document.getElementById('trip-selector-menu');
            
            container.addEventListener('click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('show');
            });
            
            document.addEventListener('click', () => {
                menu.classList.remove('show');
            });

            // Fetch list of trips for dropdown items
            fetch('data/trips.json')
                .then(res => res.json())
                .then(trips => {
                    const listContainer = document.getElementById('trip-list-dropdown');
                    listContainer.innerHTML = '';
                    
                    trips.forEach(t => {
                        if (t.id === currentId) return; // Skip active one
                        
                        const item = document.createElement('div');
                        item.className = 'trip-dropdown-item';
                        item.innerHTML = `
                            <div class="trip-dropdown-item-title">${t.title}</div>
                            <div class="trip-dropdown-item-sub">${t.subtitle}</div>
                        `;
                        item.addEventListener('click', () => {
                            menu.classList.remove('show');
                            document.getElementById('view-trip').classList.remove('show');
                            setTimeout(() => {
                                loadTripEngine(t.id, false);
                            }, 300);
                        });
                        listContainer.appendChild(item);
                    });
                });

            // Back to Title screen link
            const portalLink = document.getElementById('btn-portal-back');
            if (portalLink) {
                portalLink.addEventListener('click', () => {
                    menu.classList.remove('show');
                    document.getElementById('view-trip').classList.remove('show');
                    setTimeout(() => {
                        loadDashboard(false);
                    }, 300);
                });
            }
        }

        // Dynamic Shiori UI DOM Construction (Matching travel_guide.html structure 100%)
        function buildShioriUI(data) {
            const container = document.getElementById('trip-engine-container');
            
            let tabHeaders = '';
            let tabPanels = '';
            const keys = Object.keys(data.days).sort();
            
            keys.forEach((key, idx) => {
                const dayNum = idx + 1;
                const isFirst = idx === 0;
                const activeClass = isFirst ? 'active' : '';
                const ariaSelected = isFirst ? 'true' : 'false';
                const hiddenVal = isFirst ? 'false' : 'true';
                
                tabHeaders += `<button type="button" id="btn-${key}" class="j-tab-btn ${activeClass}" role="tab" aria-selected="${ariaSelected}" aria-controls="tab-${key}" onclick="window.switchTab('tab-${key}', this)">DAY 0${dayNum}</button>`;
                
                let cardsHtml = '';
                data.days[key].forEach(card => {
                    const imgHtml = card.image ? `<img src="${card.image}" class="j-card-img" alt="${card.title}" loading="lazy">` : '';
                    
                    let linksHtml = '';
                    if (card.tabelog) {
                        linksHtml += `<a href="${card.tabelog}" target="_blank" rel="noopener noreferrer" class="j-btn">TABELOG</a>`;
                    }
                    if (card.jalan) {
                        linksHtml += `<a href="${card.jalan}" target="_blank" rel="noopener noreferrer" class="j-btn">JALAN</a>`;
                    }
                    if (card.wallet) {
                        linksHtml += `
                            <a href="${card.wallet.apple}" target="_blank" rel="noopener noreferrer" class="j-btn app-accent">Apple Wallet</a>
                            <a href="${card.wallet.google}" target="_blank" rel="noopener noreferrer" class="j-btn app-accent">Google Wallet</a>
                        `;
                    }
                    
                    const buttonRow = linksHtml ? `<div class="j-btn-row"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(card.title)}" target="_blank" rel="noopener noreferrer" class="j-btn primary">MAP →</a>${linksHtml}</div>` : '';
                    
                    cardsHtml += `
                        <div class="j-card" id="${card.id || ''}">
                            <span class="j-card-time">${card.time}</span>
                            <div class="j-card-ttl"><span class="j-tag-badge">${card.badge}</span>${card.title}</div>
                            <p class="j-card-desc">${card.desc}</p>
                            ${imgHtml}
                            ${buttonRow}
                        </div>
                    `;
                });
                
                tabPanels += `
                    <div id="tab-${key}" class="j-tab-panel j-tab-pnl ${activeClass}" role="tabpanel" aria-labelledby="btn-${key}" aria-hidden="${hiddenVal}">
                        <section class="j-sec-header">
                            <h2 class="j-sec-en">DAY 0${dayNum}</h2>
                            <div class="j-sec-ja">
                                <span>${data.dayLabels ? data.dayLabels[key] : ''}</span>
                                <i class="j-sec-line"></i>
                            </div>
                        </section>
                        ${cardsHtml}
                    </div>
                `;
            });

            let checklistHtml = '';
            data.checklist.forEach((cat, catIdx) => {
                let itemsHtml = '';
                cat.items.forEach((item, itemIdx) => {
                    const checkId = `chk-${catIdx}-${itemIdx}`;
                    itemsHtml += `
                        <label class="checklist-item">
                            <input type="checkbox" data-check-id="${checkId}">
                            <span>${item.name}</span>
                        </label>
                    `;
                });
                checklistHtml += `
                    <div class="checklist-group">
                        <div class="checklist-group-title">${cat.category}</div>
                        ${itemsHtml}
                    </div>
                `;
            });

            // Build Weather Navigation buttons dynamically
            let weatherNavHtml = '';
            if (data.weatherLocations) {
                const wKeys = Object.keys(data.weatherLocations);
                wKeys.forEach((wKey, idx) => {
                    const loc = data.weatherLocations[wKey];
                    const activeClass = idx === 0 ? 'active' : '';
                    const pressed = idx === 0 ? 'true' : 'false';
                    weatherNavHtml += `<button type="button" class="w-tab ${activeClass}" aria-pressed="${pressed}" onclick="window.updateWeather('${wKey}', this)">${loc.label}</button>`;
                });
            }

            // Build Owner and Payer options dynamically
            let ownerOptionsHtml = '';
            let payerOptionsHtml = '';
            if (data.members) {
                data.members.forEach((member, idx) => {
                    const selected = member.id === 'kotaro' ? 'selected' : '';
                    ownerOptionsHtml += `<option value="${member.id}" ${selected}>${member.name}</option>`;
                    payerOptionsHtml += `<option value="${member.id}">${member.name}</option>`;
                });
            } else {
                ownerOptionsHtml = `
                    <option value="kotaro" selected>こうたろう</option>
                    <option value="aoi">あおい</option>
                `;
                payerOptionsHtml = `
                    <option value="aoi">あおい</option>
                    <option value="kotaro">こうたろう</option>
                `;
            }

            // Build Map Filters dynamically
            let mapFiltersHtml = `<button type="button" class="route-map-filter active" data-map-filter="all" aria-pressed="true" onclick="window.filterOverviewMap('all', this)">ALL</button>`;
            keys.forEach((key, idx) => {
                const dayNum = idx + 1;
                mapFiltersHtml += `<button type="button" class="route-map-filter" data-map-filter="${key}" aria-pressed="false" onclick="window.filterOverviewMap('${key}', this)">DAY 0${dayNum}</button>`;
            });

            // Layout matching travel_guide.html exactly
            container.innerHTML = `
                <!-- Jillion Main Visual Hero -->
                <header class="j-hero">
                    <span class="j-hero-badge">OFFICIAL TRAVEL GUIDE</span>
                    <div class="title-select-container" id="dropdown-trigger">
                        <h1 class="j-hero-bebas" style="margin: 0; line-height: 0.95;">${data.title}</h1>
                        <span class="title-select-arrow">▼</span>
                        
                        <div class="trip-dropdown-menu" id="trip-selector-menu">
                            <div id="trip-list-dropdown">
                                <!-- list of other trips -->
                            </div>
                            <div class="trip-dropdown-portal-link" id="btn-portal-back">PORTAL BACK</div>
                        </div>
                    </div>
                    <div class="j-hero-ja">${data.catchphrase || '感動の力で、二人の思い出の明日を変える。'}</div>
                    <div class="j-hero-meta">
                        <span>DATE: ${data.startDate.replace(/-/g, '.')} — ${data.endDate.replace(/-/g, '.')}</span>
                        <span>MEMBERS: ${data.subtitle}</span>
                    </div>

                    <!-- Jillion Style Countdown Widget -->
                    <div class="j-countdown">
                        <span class="j-countdown-txt">COUNTDOWN TO DEPARTURE</span>
                        <span id="trip-countdown" class="j-countdown-num">CALCULATING...</span>
                    </div>
                </header>

                <!-- PREMIUM INTERACTIVE WEATHER WIDGET CARD -->
                <div class="weather-card">
                    <div class="weather-header">
                        <span class="weather-title">🌤️ FORECAST CHECK</span>
                        <div class="weather-tabs" id="weather-nav-container">
                            ${weatherNavHtml}
                        </div>
                    </div>

                    <div class="weather-body">
                        <div>
                            <div id="w-location" style="font-family:var(--font-gothic); font-weight:800; font-size:1.05rem; color:#ffffff;">取得中...</div>
                            <div class="weather-temp-group" style="margin-top:4px;">
                                <span id="w-temp" class="weather-temp-main">--°C</span>
                                <span id="w-range" class="weather-temp-sub">--</span>
                            </div>
                        </div>
                        <div id="w-icon" class="weather-icon-box" aria-hidden="true">🌤️</div>
                    </div>

                    <div class="weather-details">
                        <div>
                            <div>POP (降水確率)</div>
                            <div id="w-pop" class="w-detail-val">--%</div>
                        </div>
                        <div>
                            <div>SUNSET (夕日)</div>
                            <div id="w-sunset" class="w-detail-val">--:--</div>
                        </div>
                        <div>
                            <div>CONDITION</div>
                            <div id="w-cond" class="w-detail-val">--</div>
                        </div>
                    </div>
                    <p class="weather-note">※Open-Meteoから自動更新します。</p>

                    <div class="weather-footer">
                        <span class="weather-status">
                            <span style="font-family:var(--font-mont); font-size:0.68rem; color:var(--text-sub);">LATEST FORECAST</span>
                            <span id="w-updated" class="weather-updated" aria-live="polite">取得中...</span>
                        </span>
                        <div style="display:flex; gap:4px;">
                            <a href="https://weathernews.jp/onebox/tenki/kagawa/" id="w-app-link" data-app-url="wni://" onclick="window.openAppWithFallback(event, this)" target="_blank" rel="noopener noreferrer" class="j-btn app-accent" aria-label="ウェザーニュースアプリを開く">
                                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAMAAABt6vClAAAAeFBMVEUAAAD///8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAATxU4bAAAAKXRSTlMABggKDA8QExYYGhwdHyEjJCcqKywtLzAzNDY4Ojw+QEJDREVHSElKS0y5qDkGAAAD0ElEQVR4nO2byZaCMBCFBWMCoozIqKCo+P8/exVwIEzV0Wp2n3NyM5XhVroLVbVqfKCHHnoYE1q96Q059j39gE/oW+V2kC0P9kSjF4y3r+42KzFz6HvmW9f6vYp/oZk/hWq3E0sU+pb5xpH+S84mSvykUN0/Zg99Tf/jRP8ts6eM/qOUPT0W/yF76Gvs72v9L/S55mNl8jB76Gsae52pS7N/Y/aB0i8WZw99Tv317G0z+0LpZ3OzBz4H/q7eP1/nQ+b3oNlV2UPfkL/5ZtbO38z/j2ZXZw98Av7eG1w328xep9ldmD18xZz+nrv0BvW2me2U7tPsruyBL9rP35F643ubmc0Z1RnM7sQe+IL9/A2pE79pZlvGZ3OzBz4H/pbeP1/nF+3bZjanvD2D2UPf0P8YqdfN2vlL97bZTe1O7MHf0T9v5x/v22a2o3x2Zg98Q/7m21nfe5vZa8rHZvZgQv/8/e7bZrbP1ezM7iXk73eT3rveNvsx5Z/Z3UvI35Z6/Xqb2TPMv1G32f8p+9ts9nvI7DnhzG7zCvkP5vP3oWb/Z/Yr5J/Yf/C39W0z+xVyo0d76MteM96+utv/f8itHveR/w+5xeM/4P8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3J7x3/6/yG3d9yn/x9ye8d/+v8ht3fcp/8fcnvHf/r/Ibd33Kf/H3h/y/f+Z758=" class="j-app-icon" alt="WNI">
                                <span>WNI</span>
                            </a>
                            <a id="w-link" href="https://weathernews.jp/" target="_blank" rel="noopener noreferrer" class="j-btn" style="padding:4px 8px;">🌐 WEB</a>
                        </div>
                    </div>
                </div>

                <!-- NOW MODE / LIVE SCHEDULE ADVISOR -->
                <section id="now-mode" class="now-card" aria-labelledby="now-mode-title">
                    <div class="now-head">
                        <div>
                            <span class="now-kicker">LIVE TRIP ASSISTANT</span>
                            <h2 id="now-mode-title">NOW MODE</h2>
                        </div>
                        <span id="offline-status" class="network-status" aria-live="polite">ONLINE</span>
                    </div>
                    <div class="now-body">
                        <span id="now-day" class="now-day">旅行前</span>
                        <div id="now-title" class="now-title">最初の予定を準備中…</div>
                        <div class="now-meta">
                            <span id="now-time">--:--</span>
                            <span id="now-countdown">出発時刻を計算中</span>
                        </div>
                        <div class="now-actions">
                            <button id="now-departure" type="button" class="now-departure" onclick="recordDepartureNow()" disabled>DEPARTURE NOW</button>
                            <a id="now-route" class="now-route" href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">ROUTE →</a>
                            <button type="button" class="now-secondary" onclick="jumpToCurrentTripDay()">TODAY</button>
                        </div>
                    </div>
                    <div class="delay-panel">
                        <div class="advisor-summary">
                            <div>
                                <span class="delay-title">LIVE SCHEDULE ADVISOR</span>
                                <p>早着・遅延に合わせて今後を再調整</p>
                            </div>
                            <button id="advisor-toggle" type="button" aria-expanded="false" aria-controls="advisor-content" onclick="toggleScheduleAdvisor()">OPEN ＋</button>
                        </div>
                        <div id="advisor-content" class="advisor-content" hidden>
                            <p>現在の進み具合を入力すると、今後の時刻・Optional可否・寄り道候補を再計算します。</p>
                            <form id="progress-form" class="progress-form">
                                <label>
                                    <span>予定との差</span>
                                    <select id="progress-direction" aria-label="予定より早いか遅いか">
                                        <option value="-1">予定より早い</option>
                                        <option value="1">予定より遅い</option>
                                    </select>
                                </label>
                                <label>
                                    <span>分数</span>
                                    <input id="progress-minutes" type="number" min="0" max="180" step="5" inputmode="numeric" value="0" aria-label="予定との差（分）">
                                </label>
                                <button type="submit">再調整</button>
                                <button type="button" class="progress-reset" onclick="resetProgressAdvisor()">RESET</button>
                            </form>
                            <div id="progress-advice" class="progress-advice" aria-live="polite">
                                <strong>ON SCHEDULE</strong>
                                <span>予定どおりです。Optionalは現地の混雑を見て判断できます。</span>
                            </div>
                            <div id="optional-advice" class="optional-advice" aria-live="polite"></div>
                        </div>
                    </div>
                </section>

                <!-- Jillion Sticky TAB Bar Navigation -->
                <nav id="nav-bar" class="j-nav-sticky" role="tablist" aria-label="旅程ナビゲーション">
                    ${tabHeaders}
                    <button type="button" id="btn-checklist" class="j-tab-btn" role="tab" aria-selected="false" aria-controls="tab-checklist" onclick="window.switchTab('tab-checklist', this)">CHECKLIST</button>
                    <button type="button" id="btn-paypay" class="j-tab-btn" role="tab" aria-selected="false" aria-controls="tab-paypay" onclick="window.switchTab('tab-paypay', this)">PAYPAY</button>
                </nav>

                <!-- MAP SECTION (Movement Overview) -->
                <div class="j-card" style="margin-bottom:24px;">
                    <div class="route-map-head">
                        <div class="j-card-ttl" style="font-family:var(--font-bebas); font-size:1.5rem; letter-spacing:1px; margin:0;">ROUTE OVERVIEW</div>
                        <div class="route-map-filters" aria-label="表示する旅程" id="map-filters-container">
                            ${mapFiltersHtml}
                        </div>
                    </div>
                    <div id="main-map" role="img" aria-label="移動全体図"></div>
                    <div class="route-map-legend" aria-label="地図の凡例">
                        <span><i class="route-map-swatch" style="background:#59d9b0;"></i>DAY 01</span>
                        <span><i class="route-map-swatch" style="background:#ffbf47;"></i>DAY 02</span>
                        <span><i class="route-map-swatch" style="background:#73a7ff;"></i>DAY 03</span>
                        <span><i class="route-map-ferry"></i>FERRY</span>
                    </div>
                    <p class="route-map-note">移動順を線で結んだ概略図です。道路・バス・自転車の詳細経路は各スポットの「MAP」から確認してください。</p>
                </div>

                <!-- Day Panels -->
                ${tabPanels}

                <!-- Packing Checklist Tab Panel -->
                <div id="tab-checklist" class="j-tab-panel j-tab-pnl" role="tabpanel" aria-labelledby="btn-checklist" aria-hidden="true">
                    <section class="j-sec-header">
                        <h2 class="j-sec-en">CHECKLIST</h2>
                        <div class="j-sec-ja">
                            <span>PACKING CHECKLIST</span>
                            <i class="j-sec-line"></i>
                        </div>
                    </section>

                    <div class="j-card checklist-card">
                        <div class="checklist-head">
                            <div>
                                <span class="now-kicker">SAVED ON THIS DEVICE</span>
                                <strong id="checklist-progress">0 / 0 COMPLETE</strong>
                            </div>
                            <button type="button" class="mini-button" onclick="resetChecklist()">RESET</button>
                        </div>
                        <div class="checklist-grid">
                            ${checklistHtml}
                        </div>
                    </div>
                </div>

                <!-- PayPay Tab Panel -->
                <div id="tab-paypay" class="j-tab-panel j-tab-pnl" role="tabpanel" aria-labelledby="btn-paypay" aria-hidden="true">
                    <section class="j-sec-header">
                        <h2 class="j-sec-en">PAYPAY SPLIT</h2>
                        <div class="j-sec-ja">
                            <span>PayPay グループ割り勘</span>
                            <i class="j-sec-line"></i>
                        </div>
                    </section>

                    <div class="j-card expense-card">
                        <div class="share-room-panel">
                            <div class="share-room-head">
                                <div>
                                    <span class="now-kicker">TWO-DEVICE LIVE SYNC</span>
                                    <strong id="sync-title">共有ルームへ接続中…</strong>
                                </div>
                                <span id="sync-badge" class="sync-badge">CONNECTING</span>
                            </div>
                            <p id="sync-status" class="sync-status" aria-live="polite">Firebaseに匿名接続しています。</p>
                            <div class="share-room-actions">
                                <button id="share-link-button" type="button" onclick="copyLedgerInviteLink()" disabled>招待リンクをコピー</button>
                                <span id="sync-room-code" class="sync-room-code">ROOM: ------</span>
                            </div>
                            <p class="sync-note">この招待リンクを蒼さんの端末で一度だけ開くと、以後は二人の入力がリアルタイム同期されます。</p>
                        </div>
                        <div class="expense-head">
                            <div>
                                <span class="now-kicker">SHARED SPLIT LEDGER</span>
                                <h3>旅費を記録</h3>
                            </div>
                            <button type="button" class="mini-button" onclick="clearExpenses()">ALL CLEAR</button>
                        </div>
                        <label class="device-owner-panel">
                            <span>この端末を使う人</span>
                            <select id="device-owner">
                                ${ownerOptionsHtml}
                            </select>
                            <small>最初に一度だけ選択。旅程の「PAID」ボタンで支払者へ自動入力します。</small>
                        </label>
                        <form id="expense-form" class="expense-form">
                            <label>
                                <span>金額</span>
                                <input id="expense-amount" type="number" min="1" step="1" inputmode="numeric" placeholder="例：3200" required>
                            </label>
                            <label>
                                <span>支払った人</span>
                                <select id="expense-payer">
                                    ${payerOptionsHtml}
                                </select>
                            </label>
                            <label>
                                <span>カテゴリ</span>
                                <select id="expense-category">
                                    <option value="食事">食事</option>
                                    <option value="交通">交通</option>
                                    <option value="観光">観光</option>
                                    <option value="買い物">買い物</option>
                                    <option value="宿泊">宿泊</option>
                                    <option value="その他">その他</option>
                                </select>
                            </label>
                            <label class="expense-note-field">
                                <span>メモ</span>
                                <input id="expense-note" type="text" maxlength="40" placeholder="例：五志喜">
                            </label>
                            <label class="expense-comment-field">
                                <span>コメント</span>
                                <input id="expense-comment" type="text" maxlength="80" placeholder="例：予約分／あとでレシート確認">
                            </label>
                            <button type="submit" class="expense-submit">ADD EXPENSE</button>
                        </form>
                        <div class="expense-summary" aria-live="polite">
                            <div><span>TOTAL</span><strong id="expense-total">¥0</strong></div>
                            <div><span>1人分</span><strong id="expense-share">¥0</strong></div>
                            <div class="expense-settlement"><span>精算</span><strong id="expense-settlement">まだ支出はありません</strong></div>
                        </div>
                        <ul id="expense-list" class="expense-list" aria-label="支出一覧"></ul>
                        <p class="local-save-note">入力は端末にも一時保存し、共有ルーム接続時はFirebaseで二人の端末へ同期します。</p>
                    </div>

                    <!-- PAYPAY NATIVE APP + WEB LINK -->
                    <div class="j-widget" style="margin-top:12px;">
                        <div>
                            <h3 style="font-family:var(--font-bebas); font-size:1.6rem; letter-spacing:1px; color:#ffffff;">PAYPAY SPLIT</h3>
                            <p style="font-size:0.78rem; color:var(--text-sub);">あおい ＆ こうたろう グループ会計（アプリ起動後にグループ・金額を設定）</p>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <a href="https://paypay.ne.jp/" data-app-url="paypay://launch" onclick="window.openAppWithFallback(event, this)" target="_blank" rel="noopener noreferrer" class="j-btn app-accent" style="padding:10px 16px;">

                                <span>APP</span>
                            </a>
                            <a href="https://paypay.ne.jp/" target="_blank" rel="noopener noreferrer" class="j-btn" style="padding:10px 16px;">🌐 WEB</a>
                        </div>
                    </div>
                </div>
            `;
        }

        // Expose helper functions globally
        window.openAppWithFallback = openAppWithFallback;
    </script>
</body>
</html>
