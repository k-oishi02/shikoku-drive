<!DOCTYPE html>
<html lang="ja">
<head>
        <script>
        // GLOBAL ERROR CAPTURER / PWA SELF-HEALING ENGINE
        window.addEventListener('error', function(e) {
            console.error("Fatal PWA Script Error detected: ", e.message);
            // If we hit a script loading error that causes black screen, reset cache and reload!
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (let r of registrations) {
                        r.unregister();
                    }
                    caches.keys().then(keys => {
                        for (let k of keys) caches.delete(k);
                    });
                    localStorage.clear();
                    console.log("Self-healing triggered. Cache cleared. Reloading clean...");
                    // Append temporary cache-busting timestamp to bypass hardware PWA proxy cache
                    const cleanUrl = window.location.origin + window.location.pathname + '?v=' + Date.now();
                    window.location.replace(cleanUrl);
                });
            }
        });

        // ULTIMATE INSTANT CACHE RESET HANDLER v24
        if ('serviceWorker' in navigator && !localStorage.getItem('ultimate_reset_v24')) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                let hadRegistrations = false;
                for (let r of registrations) {
                    r.unregister();
                    hadRegistrations = true;
                }
                localStorage.setItem('ultimate_reset_v24', 'true');
                if (hadRegistrations) {
                    caches.keys().then(keys => {
                        for (let k of keys) caches.delete(k);
                    });
                    console.log("Stuck PWA Cache destroyed instantly. Reloading...");
                    window.location.reload();
                }
            });
        }
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#242424">
    <title>OUR TRAVELS | 旅のしおり</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Shippori+Gothic:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="images/header_shikoku.png">
    <link rel="stylesheet" href="src/style.css?v=23">
    <link rel="stylesheet" href="src/enhancements.css?v=23">
    <link rel="stylesheet" href="src/shiori_styles.css?v=25">


    <style>
        :root {
            --font-bebas: 'Bebas Neue', sans-serif;
            --font-mont: 'Montserrat', sans-serif;
            --font-gothic: 'Shippori Gothic', sans-serif;

            --bg-body: #1c1c1c;
            --bg-card: #242424;
            --border-line: #383838;
            --border-highlight: #ffffff;

            --text-main: #ffffff;
            --text-sub: #a1a1a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-gothic);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.75;
            padding-bottom: 60px;
            overflow-x: hidden;
        }
        
        .l-container { width: 100%; max-width: 540px; margin: 0 auto; padding: 0 20px; position: relative; }

        /* Jillion Side Mark Brackets */
        .c-mark-left, .c-mark-right {
            position: fixed; top: 0; bottom: 0; width: 12px; z-index: 50; pointer-events: none; opacity: 0.25;
        }
        .c-mark-left { left: 6px; border-left: 1px solid #fff; border-top: 1px solid #fff; border-bottom: 1px solid #fff; }
        .c-mark-right { right: 6px; border-right: 1px solid #fff; border-top: 1px solid #fff; border-bottom: 1px solid #fff; }

        /* Portal Title Page Styles */
        .portal-view {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .portal-view.fade {
            opacity: 0;
            transform: translateY(10px);
        }
        .portal-view.show {
            opacity: 1;
            transform: translateY(0);
        }
        .db-header {
            padding: 80px 0 40px;
            border-bottom: 1px solid var(--border-line);
            margin-bottom: 40px;
            text-align: center;
        }
        .db-title {
            font-family: var(--font-bebas);
            font-size: 4.8rem;
            letter-spacing: 4px;
            line-height: 0.85;
            margin-bottom: 12px;
            font-weight: 400;
        }
        .db-subtitle {
            font-family: var(--font-mont);
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-sub);
            letter-spacing: 6px;
            text-transform: uppercase;
        }
        .db-section-title {
            font-family: var(--font-mont);
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--text-sub);
            margin-bottom: 24px;
            text-transform: uppercase;
            border-left: 2px solid #fff;
            padding-left: 12px;
        }
        .db-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 60px;
        }
        .db-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 30px 24px;
            position: relative;
            cursor: pointer;
            transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .db-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .db-card-date {
            font-family: var(--font-mont);
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--text-sub);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .db-card-title {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .db-card-sub {
            font-family: var(--font-mont);
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-sub);
            text-transform: uppercase;
        }
        .db-empty {
            border: 1px dashed var(--border-line);
            padding: 50px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* In-App Trip Selector Dropdown Modal */
        .title-select-container {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .title-select-arrow {
            font-size: 0.8rem;
            margin-left: 10px;
            color: var(--text-sub);
            transition: transform 0.2s ease;
        }
        .title-select-container:hover .title-select-arrow {
            color: #fff;
        }
        .trip-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #242424;
            border: 1px solid var(--border-line);
            z-index: 1000;
            min-width: 260px;
            display: none;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            margin-top: 8px;
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .trip-dropdown-menu.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .trip-dropdown-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-line);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .trip-dropdown-item:last-child {
            border-bottom: none;
        }
        .trip-dropdown-item:hover {
            background: #333333;
        }
        .trip-dropdown-item-title {
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }
        .trip-dropdown-item-sub {
            font-family: var(--font-mont);
            font-size: 0.65rem;
            color: var(--text-sub);
            letter-spacing: 1px;
        }
        .trip-dropdown-portal-link {
            border-top: 1px solid var(--border-line);
            background: #1c1c1c;
            text-align: center;
            font-family: var(--font-mont);
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 14px 20px;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .trip-dropdown-portal-link:hover {
            color: #fff;
        }

        /* Detail View Styles */
        .trip-view {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .trip-view.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="c-mark-left"></div>
    <div class="c-mark-right"></div>

    <!-- 1. PORTAL TITLE SCREEN (Index List View) -->
    <div id="view-dashboard" class="portal-view l-container">
        <header class="db-header">
            <h1 class="db-title">OUR JOURNEYS</h1>
            <p class="db-subtitle">TRAVEL SHIORI ENGINE</p>
        </header>

        <h2 class="db-section-title">Select Trip Plan</h2>
        <div id="trips-container" class="db-grid">
            <div class="db-empty">Loading trip indexes...</div>
        </div>
    </div>

    <!-- 2. TRIP DETAIL ENGINE VIEW -->
    <div id="view-trip" class="trip-view" style="display: none;">
        <div id="trip-engine-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module">
        // Routing runs IMMEDIATELY — no await blocking
        const params = new URLSearchParams(window.location.search);
        const tripId = params.get('trip');

        if (tripId) {
            loadTripEngine(tripId, false);
        } else {
            loadDashboard(false);
        }

        // Bind back/forward browser button navigation
        window.addEventListener('popstate', (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const currentId = urlParams.get('trip');
            if (currentId) {
                loadTripEngine(currentId, true);
            } else {
                loadDashboard(true);
            }
        });

        // Firebase sync loads in background — non-blocking
        import('./src/firebase-sync.js?v=25')
            .then(mod => { window._initSyncEngine = mod.initSyncEngine; })
            .catch(e => console.warn('Firebase sync unavailable:', e.message));

        // Load Portal Page (Title Screen)
        function loadDashboard(isPopState = false) {
            const view = document.getElementById('view-dashboard');
            document.getElementById('view-trip').style.display = 'none';
            view.style.display = 'block';
            setTimeout(() => view.classList.add('show'), 50);

            if (!isPopState) {
                history.pushState(null, '', './');
            }

            fetch('data/trips.json')
                .then(res => res.json())
                .then(trips => {
                    const container = document.getElementById('trips-container');
                    container.innerHTML = '';
                    if (trips.length === 0) {
                        container.innerHTML = '<div class="db-empty">No active trip configurations found.</div>';
                        return;
                    }
                    trips.forEach(t => {
                        const card = document.createElement('div');
                        card.className = 'db-card';
                        card.innerHTML = `
                            <div class="db-card-date">${t.date.replace(/-/g, '/')}</div>
                            <div class="db-card-title">${t.title}</div>
                            <div class="db-card-sub">${t.subtitle}</div>
                        `;
                        card.addEventListener('click', () => {
                            view.classList.remove('show');
                            setTimeout(() => {
                                loadTripEngine(t.id, false);
                            }, 300);
                        });
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('trips-container').innerHTML = 
                        '<div class="db-empty" style="color: #ff6b6b;">Error loading trip config.</div>';
                });
        }

        // Load Shiori Detail Page
        function loadTripEngine(tripId, isPopState = false) {
            const view = document.getElementById('view-trip');
            document.getElementById('view-dashboard').style.display = 'none';
            view.style.display = 'block';

            if (!isPopState) {
                history.pushState(null, '', `./?trip=${tripId}`);
            }

            // Tear down old Leaflet map instance and DOM hooks if switching trips dynamically
            if (window.map && typeof window.map.remove === 'function') {
                try {
                    window.map.remove();
                    window.map = null;
                } catch(e) {}
            }
            
            // Fetch and render
            fetch(`data/${tripId}.json`)
                .then(res => res.json())
                .then(data => {
                    buildShioriUI(data);
                    window.currentTripId = tripId;
                    
                    // Import enhancements logic after rendering DOM
                    const script = document.createElement('script');
                    script.src = `src/enhancements.js?v=23`;
                    document.body.appendChild(script);

                    // Initialize sync engine for specific Trip ID (loaded async in background)
                    if (typeof window._initSyncEngine === 'function') {
                        window._initSyncEngine(tripId);
                    }
                    
                    setTimeout(() => view.classList.add('show'), 50);
                    setupInAppDropdown(tripId);
                })
                .catch(err => {
                    container.innerHTML = `
                        <div class="l-container" style="padding: 100px 20px; text-align: center;">
                            <h2 style="color: #ff6b6b; margin-bottom: 20px;">Trip Not Found</h2>
                            <p style="color: #a1a1a1;">Could not load trip data for "${tripId}".</p>
                            <a href="./" class="j-btn" style="margin-top: 20px; text-decoration: none;">Return to Home</a>
                        </div>
                    `;
                });
        }

        // Setup Dropdown selector for changing trips on the fly inside the Shiori view
        function setupInAppDropdown(currentId) {
            const container = document.getElementById('dropdown-trigger');
            if (!container) return;
            
            const menu = document.getElementById('trip-selector-menu');
            
            container.addEventListener('click', (e) => {
                e.stopPropagation();
                menu.classList.toggle('show');
            });
            
            document.addEventListener('click', () => {
                menu.classList.remove('show');
            });

            // Fetch list of trips for dropdown items
            fetch('data/trips.json')
                .then(res => res.json())
                .then(trips => {
                    const listContainer = document.getElementById('trip-list-dropdown');
                    listContainer.innerHTML = '';
                    
                    trips.forEach(t => {
                        if (t.id === currentId) return; // Skip active one
                        
                        const item = document.createElement('div');
                        item.className = 'trip-dropdown-item';
                        item.innerHTML = `
                            <div class="trip-dropdown-item-title">${t.title}</div>
                            <div class="trip-dropdown-item-sub">${t.subtitle}</div>
                        `;
                        item.addEventListener('click', () => {
                            menu.classList.remove('show');
                            document.getElementById('view-trip').classList.remove('show');
                            setTimeout(() => {
                                loadTripEngine(t.id, false);
                            }, 300);
                        });
                        listContainer.appendChild(item);
                    });
                });

            // Back to Title screen link
            const portalLink = document.getElementById('btn-portal-back');
            if (portalLink) {
                portalLink.addEventListener('click', () => {
                    menu.classList.remove('show');
                    document.getElementById('view-trip').classList.remove('show');
                    setTimeout(() => {
                        loadDashboard(false);
                    }, 300);
                });
            }
        }

        // Dynamic Shiori UI DOM Construction
        function buildShioriUI(data) {
            const container = document.getElementById('trip-engine-container');
            
            let tabHeaders = '';
            let tabPanels = '';
            const keys = Object.keys(data.days).sort();
            
            keys.forEach((key, idx) => {
                const dayNum = idx + 1;
                const isFirst = idx === 0;
                const activeClass = isFirst ? 'active' : '';
                const ariaSelected = isFirst ? 'true' : 'false';
                
                tabHeaders += `<button type="button" role="tab" aria-selected="${ariaSelected}" aria-controls="tab-${key}" class="j-tab-lnk ${activeClass}">DAY 0${dayNum}</button>`;
                
                let cardsHtml = '';
                data.days[key].forEach(card => {
                    const imgHtml = card.image ? `<img src="${card.image}" class="j-card-img" alt="${card.title}">` : '';
                    
                    let linksHtml = '';
                    if (card.tabelog) {
                        linksHtml += `<a href="${card.tabelog}" target="_blank" class="j-btn-mini brand-tabelog">TABELOG</a>`;
                    }
                    if (card.jalan) {
                        linksHtml += `<a href="${card.jalan}" target="_blank" class="j-btn-mini brand-jalan">JALAN</a>`;
                    }
                    if (card.wallet) {
                        linksHtml += `
                            <a href="${card.wallet.apple}" target="_blank" class="j-btn-mini brand-apple">APPLE WALLET</a>
                            <a href="${card.wallet.google}" target="_blank" class="j-btn-mini brand-google">GOOGLE WALLET</a>
                        `;
                    }
                    
                    const buttonRow = linksHtml ? `<div class="j-btn-row">${linksHtml}</div>` : '';
                    
                    cardsHtml += `
                        <div class="j-card" data-lat="${card.lat || ''}" data-lon="${card.lon || ''}">
                            <span class="j-card-time">${card.time}</span>
                            <div class="j-card-ttl"><span class="j-tag-badge">${card.badge}</span>${card.title}</div>
                            <p class="j-card-desc">${card.desc}</p>
                            ${imgHtml}
                            ${buttonRow}
                        </div>
                    `;
                });
                
                tabPanels += `
                    <div id="tab-${key}" role="tabpanel" class="j-tab-pnl ${activeClass}">
                        <div class="j-timeline">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            });

            let checklistHtml = '';
            data.checklist.forEach((cat, catIdx) => {
                let itemsHtml = '';
                cat.items.forEach((item, itemIdx) => {
                    const itemId = `chk-${catIdx}-${itemIdx}`;
                    itemsHtml += `
                        <div class="j-chk-item">
                            <input type="checkbox" id="${itemId}">
                            <label for="${itemId}">
                                <span class="j-chk-box"></span>
                                <div class="j-chk-txt">
                                    <div class="j-chk-lbl">${item.name}</div>
                                    <div class="j-chk-sub">${item.desc}</div>
                                </div>
                            </label>
                        </div>
                    `;
                });
                checklistHtml += `
                    <div class="j-chk-group">
                        <div class="j-chk-grp-title">${cat.category}</div>
                        ${itemsHtml}
                    </div>
                `;
            });

            // Build Weather Navigation buttons from JSON data
            let weatherNavHtml = '';
            if (data.weatherLocations) {
                const wKeys = Object.keys(data.weatherLocations);
                wKeys.forEach((wKey, idx) => {
                    const loc = data.weatherLocations[wKey];
                    const activeClass = idx === 0 ? 'active' : '';
                    weatherNavHtml += `<button type="button" class="j-w-nav-btn ${activeClass}" data-lat="${loc.lat}" data-lon="${loc.lon}" data-date="${loc.tripDate || ''}">${loc.label}</button>`;
                });
            }

            // Build Payer Radio buttons from members JSON data
            let payerRadiosHtml = '';
            if (data.members) {
                data.members.forEach((member, idx) => {
                    const checked = idx === 0 ? 'checked' : '';
                    payerRadiosHtml += `
                        <label class="j-radio-lbl">
                            <input type="radio" name="payer" value="${member.id}" ${checked}>
                            <span class="j-radio-box"></span>${member.name}
                        </label>
                    `;
                });
            }

            // Layout
            container.innerHTML = `
                <!-- Dynamic Hero with Selector Menu -->
                <header class="j-hero l-container">
                    <span class="j-hero-badge">TRAVEL GUIDE</span>
                    <div class="title-select-container" id="dropdown-trigger">
                        <h1 class="j-hero-bebas" style="margin: 0; line-height: 0.95;">${data.title}</h1>
                        <span class="title-select-arrow">▼</span>
                        
                        <div class="trip-dropdown-menu" id="trip-selector-menu">
                            <div id="trip-list-dropdown">
                                <!-- list of other trips -->
                            </div>
                            <div class="trip-dropdown-portal-link" id="btn-portal-back">PORTAL BACK</div>
                        </div>
                    </div>
                    
                    <div class="j-hero-grid" style="margin-top: 18px;">
                        <div class="j-hero-info">
                            <span class="j-info-lbl">MEMBERS</span>
                            <span class="j-info-val">${data.subtitle}</span>
                        </div>
                        <div class="j-hero-info">
                            <span class="j-info-lbl">DATES</span>
                            <span class="j-info-val">${data.startDate.replace(/-/g, '/')} - ${data.endDate.replace(/-/g, '/')}</span>
                        </div>
                    </div>
                </header>

                <!-- Weather forecast -->
                <section class="l-container">
                    <div class="j-w-widget">
                        <div class="j-w-header">
                            <div class="j-w-loc" id="w-location">Loading location...</div>
                            <div class="j-w-upd" id="w-updated">取得中...</div>
                        </div>
                        <div class="j-w-body">
                            <div class="j-w-row-main">
                                <div class="j-w-temp" id="w-temp">--°C</div>
                                <div class="j-w-icon" id="w-icon">🌤️</div>
                            </div>
                            <div class="j-w-row-sub">
                                <div class="j-w-stat"><span class="j-w-lbl">COND</span><span id="w-cond">---</span></div>
                                <div class="j-w-stat"><span class="j-w-lbl">RANGE</span><span id="w-range">-- / --</span></div>
                                <div class="j-w-stat"><span class="j-w-lbl">RAIN</span><span id="w-rain">--%</span></div>
                                <div class="j-w-stat"><span class="j-w-lbl">SUNSET</span><span id="w-sunset">--:--</span></div>
                            </div>
                        </div>
                        <div class="j-w-nav" id="weather-nav-container">${weatherNavHtml}</div>
                    </div>
                </section>

                <!-- Live Advisor -->
                <section class="l-container" style="margin-top: 20px;">
                    <div class="j-advisor">
                        <div class="j-advisor-header">
                            <div class="j-advisor-title">LIVE SCHEDULE ADVISOR</div>
                            <div class="j-advisor-badge" id="adv-badge">STANDBY</div>
                        </div>
                        <div class="j-advisor-body">
                            <p class="j-advisor-desc" id="adv-desc">NOW MODEを有効にすると、現在の進行状況に応じたアドバイスが表示されます。</p>
                            <div class="j-advisor-row-btn" id="adv-actions" style="display: none;">
                                <button type="button" class="j-btn action-now-dept" id="btn-now-dept">DEPARTURE NOW</button>
                                <button type="button" class="j-btn-sub action-now-skip" id="btn-now-skip">SKIP SPOTS</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Interactive Map Frame -->
                <section class="l-container" style="margin-top: 20px;">
                    <div class="j-map-frame">
                        <div id="map" class="j-map-inner"></div>
                        <button type="button" class="j-map-btn" id="btn-toggle-follow" style="display: none;">
                            <span class="j-map-btn-dot"></span>NOW TRACKING
                        </button>
                    </div>
                </section>

                <!-- Tab navigation -->
                <div class="l-container" style="margin-top: 30px;">
                    <nav class="j-tabs-wrapper">
                        <div class="j-tabs-nav" role="tablist">
                            ${tabHeaders}
                            <button type="button" role="tab" aria-selected="false" aria-controls="tab-checklist" class="j-tab-lnk">CHECK</button>
                            <button type="button" role="tab" aria-selected="false" aria-controls="tab-paypay" class="j-tab-lnk">PAY</button>
                        </div>
                    </nav>

                    <!-- Tab panels -->
                    ${tabPanels}

                    <!-- Packing Checklist Tab Panel -->
                    <div id="tab-checklist" role="tabpanel" class="j-tab-pnl">
                        <div class="j-checklist-card">
                            <div class="j-chk-header">
                                <h3 class="j-chk-title">PACKING CHECKLIST</h3>
                                <p class="j-chk-desc">出発前夜と当日の朝に最終チェック！</p>
                            </div>
                            <div class="j-chk-body">
                                ${checklistHtml}
                            </div>
                        </div>
                    </div>

                    <!-- PayPay Group Split Tab Panel -->
                    <div id="tab-paypay" role="tabpanel" class="j-tab-pnl">
                        <div class="j-warikan-card">
                            <div class="j-warikan-header">
                                <h3 class="j-warikan-title">PAYPAY GROUP BILL</h3>
                                <div class="j-warikan-total">
                                    <div class="j-warikan-total-lbl">お互いの支払合計</div>
                                    <div class="j-warikan-total-val" id="warikan-ratio">メンバーを読込中...</div>
                                </div>
                                <div class="j-warikan-result" id="warikan-result">精算: --</div>
                            </div>
                            <div class="j-warikan-body">
                                <form class="j-warikan-form" id="expense-form">
                                    <div class="j-form-group">
                                        <label for="exp-title" class="j-form-lbl">支出項目</label>
                                        <input type="text" id="exp-title" class="j-form-input" placeholder="例: うどんバカ一代, ガソリン代" required>
                                    </div>
                                    <div class="j-form-group">
                                        <label for="exp-amount" class="j-form-lbl">金額 (円)</label>
                                        <input type="number" id="exp-amount" class="j-form-input" placeholder="金額を入力してください" required>
                                    </div>
                                    <div class="j-form-group">
                                        <label class="j-form-lbl">支払った人</label>
                                        <div class="j-radio-group" id="payer-radio-container">${payerRadiosHtml}</div>
                                    </div>
                                    <button type="submit" class="j-btn-submit">支出を追加する</button>
                                </form>

                                <div class="j-expense-list">
                                    <div class="j-list-header">
                                        <div class="j-list-title">最近の支出</div>
                                        <button type="button" class="j-list-clear" id="btn-clear-expenses">履歴をリセット</button>
                                    </div>
                                    <div class="j-list-body" id="expense-list-container">
                                        <div class="j-list-empty">登録された支出はありません。</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Floating network status bar -->
                <div class="j-offline-bar" id="offline-status">ONLINE</div>
            `;
        }
    </script>
</body>
</html>
