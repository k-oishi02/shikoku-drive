<!DOCTYPE html>
<html lang="ja">
<head>
    <script>
        // ULTIMATE INSTANT CACHE RESET HANDLER v22 (RUNS EXACTLY ONCE PER VERSION)
        if ('serviceWorker' in navigator && !localStorage.getItem('ultimate_reset_v22')) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                let hadRegistrations = false;
                for (let r of registrations) {
                    r.unregister();
                    hadRegistrations = true;
                }
                localStorage.setItem('ultimate_reset_v22', 'true');
                if (hadRegistrations) {
                    caches.keys().then(keys => {
                        for (let k of keys) caches.delete(k);
                    });
                    console.log("Stuck PWA Cache destroyed instantly. Reloading...");
                    window.location.reload();
                }
            });
        }
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#242424">
    <title>MY TRAVEL PORTAL | 旅のしおり</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Shippori+Gothic:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="manifest" href="src/manifest.webmanifest">
    <link rel="apple-touch-icon" href="images/header_shikoku.png">
    <link rel="stylesheet" href="src/enhancements.css?v=22">

    <style>
        :root {
            --font-bebas: 'Bebas Neue', sans-serif;
            --font-mont: 'Montserrat', sans-serif;
            --font-gothic: 'Shippori Gothic', sans-serif;

            --bg-body: #1c1c1c;
            --bg-card: #242424;
            --border-line: #383838;
            --border-highlight: #ffffff;

            --text-main: #ffffff;
            --text-sub: #a1a1a1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-gothic);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.75;
            padding-bottom: 60px;
            overflow-x: hidden;
        }
        
        .l-container { width: 100%; max-width: 540px; margin: 0 auto; padding: 0 20px; position: relative; }

        /* Jillion Side Mark Brackets */
        .c-mark-left, .c-mark-right {
            position: fixed; top: 0; bottom: 0; width: 12px; z-index: 50; pointer-events: none; opacity: 0.25;
        }
        .c-mark-left { left: 6px; border-left: 1px solid #fff; border-top: 1px solid #fff; border-bottom: 1px solid #fff; }
        .c-mark-right { right: 6px; border-right: 1px solid #fff; border-top: 1px solid #fff; border-bottom: 1px solid #fff; }

        /* Dashboard Styles */
        .db-header {
            padding: 48px 0 24px;
            border-bottom: 1px solid var(--border-line);
            margin-bottom: 30px;
        }
        .db-title {
            font-family: var(--font-bebas);
            font-size: 3.5rem;
            letter-spacing: 2px;
            line-height: 0.9;
            margin-bottom: 10px;
        }
        .db-subtitle {
            font-family: var(--font-mont);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 3px;
        }
        .db-section-title {
            font-family: var(--font-mont);
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-sub);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .db-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .db-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            padding: 24px;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s ease, transform 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .db-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-2px);
        }
        .db-card-date {
            font-family: var(--font-mont);
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .db-card-title {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .db-card-sub {
            font-family: var(--font-mont);
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--text-sub);
        }
        .db-empty {
            border: 1px dashed var(--border-line);
            padding: 40px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="c-mark-left"></div>
    <div class="c-mark-right"></div>

    <!-- 1. DASHBOARD VIEW (Shown when no ?trip=ID param) -->
    <div id="view-dashboard" class="l-container" style="display: none;">
        <header class="db-header">
            <h1 class="db-title">MY TRAVELS</h1>
            <p class="db-subtitle">PERSONAL SHIORI ENGINE</p>
        </header>

        <h2 class="db-section-title">Active Trips</h2>
        <div id="trips-container" class="db-grid">
            <!-- Dynamically populated -->
            <div class="db-empty">Loading active trip plans...</div>
        </div>
    </div>

    <!-- 2. TRIP DETAIL VIEW (Dynamic Travel Shiori Engine) -->
    <div id="view-trip" style="display: none;">
        <!-- Container for dynamically injected premium shiori UI -->
        <div id="trip-engine-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module">
        import { initSyncEngine } from './src/firebase-sync.js?v=22';

        // Routing entry point
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const tripId = params.get('trip');

            if (tripId) {
                loadTripEngine(tripId);
            } else {
                loadDashboard();
            }
        });

        // Load dashboard view
        function loadDashboard() {
            document.getElementById('view-dashboard').style.display = 'block';
            document.getElementById('view-trip').style.display = 'none';

            fetch('data/trips.json')
                .then(res => res.json())
                .then(trips => {
                    const container = document.getElementById('trips-container');
                    container.innerHTML = '';
                    if (trips.length === 0) {
                        container.innerHTML = '<div class="db-empty">No trip plans found. Add one in data/trips.json.</div>';
                        return;
                    }
                    trips.forEach(t => {
                        const card = document.createElement('a');
                        card.className = 'db-card';
                        card.href = `./?trip=${t.id}`;
                        card.innerHTML = `
                            <div class="db-card-date">${t.date}</div>
                            <div class="db-card-title">${t.title}</div>
                            <div class="db-card-sub">${t.subtitle}</div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('trips-container').innerHTML = 
                        '<div class="db-empty" style="color: #ff6b6b;">Error loading trip config.</div>';
                });
        }

        // Load trip engine view
        function loadTripEngine(tripId) {
            document.getElementById('view-dashboard').style.display = 'none';
            document.getElementById('view-trip').style.display = 'block';

            // Fetch specific trip JSON data
            fetch(`data/${tripId}.json`)
                .then(res => res.json())
                .then(data => {
                    buildShioriUI(data);
                    // Initialize dynamic script enhancements and Firebase Sync with current Trip ID
                    window.currentTripId = tripId;
                    
                    // Import enhancements script dynamically to bind events after DOM is ready
                    const script = document.createElement('script');
                    script.src = `src/enhancements.js?v=22`;
                    document.body.appendChild(script);

                    // Initialize Firebase Synchronization engine specifically for this Trip ID
                    initSyncEngine(tripId);
                })
                .catch(err => {
                    document.getElementById('trip-engine-container').innerHTML = `
                        <div class="l-container" style="padding: 100px 20px; text-align: center;">
                            <h2 style="color: #ff6b6b; margin-bottom: 20px;">Trip Not Found</h2>
                            <p style="color: #a1a1a1;">The trip ID "${tripId}" could not be loaded.</p>
                            <a href="./" class="j-btn" style="display: inline-block; margin-top: 20px; text-decoration: none; padding: 12px 24px; background: #242424; color: #fff; border: 1px solid #383838;">Return to Dashboard</a>
                        </div>
                    `;
                });
        }

        // Build premium HTML layout dynamically from JSON configuration
        function buildShioriUI(data) {
            const container = document.getElementById('trip-engine-container');
            
            // Build tab links dynamically based on days present
            let tabHeaders = '';
            let tabPanels = '';
            
            const keys = Object.keys(data.days).sort();
            keys.forEach((key, idx) => {
                const dayNum = idx + 1;
                const isFirst = idx === 0;
                const activeClass = isFirst ? 'active' : '';
                const ariaSelected = isFirst ? 'true' : 'false';
                
                tabHeaders += `<button type="button" role="tab" aria-selected="${ariaSelected}" aria-controls="tab-${key}" class="j-tab-lnk ${activeClass}">DAY 0${dayNum}</button>`;
                
                // Build cards for this day
                let cardsHtml = '';
                data.days[key].forEach(card => {
                    const imgHtml = card.image ? `<img src="${card.image}" class="j-card-img" alt="${card.title}">` : '';
                    
                    // Direct links buttons
                    let linksHtml = '';
                    if (card.tabelog) {
                        linksHtml += `<a href="${card.tabelog}" target="_blank" class="j-btn-mini brand-tabelog">TABELOG</a>`;
                    }
                    if (card.jalan) {
                        linksHtml += `<a href="${card.jalan}" target="_blank" class="j-btn-mini brand-jalan">JALAN</a>`;
                    }
                    if (card.wallet) {
                        linksHtml += `
                            <a href="${card.wallet.apple}" target="_blank" class="j-btn-mini brand-apple">APPLE WALLET</a>
                            <a href="${card.wallet.google}" target="_blank" class="j-btn-mini brand-google">GOOGLE WALLET</a>
                        `;
                    }
                    
                    const buttonRow = linksHtml ? `<div class="j-btn-row">${linksHtml}</div>` : '';
                    
                    cardsHtml += `
                        <div class="j-card" data-lat="${card.lat || ''}" data-lon="${card.lon || ''}">
                            <span class="j-card-time">${card.time}</span>
                            <div class="j-card-ttl"><span class="j-tag-badge">${card.badge}</span>${card.title}</div>
                            <p class="j-card-desc">${card.desc}</p>
                            ${imgHtml}
                            ${buttonRow}
                        </div>
                    `;
                });
                
                tabPanels += `
                    <div id="tab-${key}" role="tabpanel" class="j-tab-pnl ${activeClass}">
                        <div class="j-timeline">
                            ${cardsHtml}
                        </div>
                    </div>
                `;
            });

            // Build Checklist categories
            let checklistHtml = '';
            data.checklist.forEach((cat, catIdx) => {
                let itemsHtml = '';
                cat.items.forEach((item, itemIdx) => {
                    const itemId = `chk-${catIdx}-${itemIdx}`;
                    itemsHtml += `
                        <div class="j-chk-item">
                            <input type="checkbox" id="${itemId}">
                            <label for="${itemId}">
                                <span class="j-chk-box"></span>
                                <div class="j-chk-txt">
                                    <div class="j-chk-lbl">${item.name}</div>
                                    <div class="j-chk-sub">${item.desc}</div>
                                </div>
                            </label>
                        </div>
                    `;
                });
                checklistHtml += `
                    <div class="j-chk-group">
                        <div class="j-chk-grp-title">${cat.category}</div>
                        ${itemsHtml}
                    </div>
                `;
            });

            // Put everything together
            container.innerHTML = `
                <!-- Jillion Main Visual Hero -->
                <header class="j-hero l-container">
                    <span class="j-hero-badge">TRAVEL GUIDE</span>
                    <h1 class="j-hero-bebas">${data.title}</h1>
                    <div class="j-hero-grid">
                        <div class="j-hero-info">
                            <span class="j-info-lbl">MEMBERS</span>
                            <span class="j-info-val">${data.subtitle}</span>
                        </div>
                        <div class="j-hero-info">
                            <span class="j-info-lbl">DATES</span>
                            <span class="j-info-val">${data.startDate.replace(/-/g, '/')} - ${data.endDate.replace(/-/g, '/')}</span>
                        </div>
                    </div>
                </header>

                <!-- Dynamic Weather Forecast Panel -->
                <section class="l-container">
                    <div class="j-w-widget">
                        <div class="j-w-header">
                            <div class="j-w-loc" id="w-location">Loading location...</div>
                            <div class="j-w-upd" id="w-updated">取得中...</div>
                        </div>
                        <div class="j-w-body">
                            <div class="j-w-row-main">
                                <div class="j-w-temp" id="w-temp">--°C</div>
                                <div class="j-w-icon" id="w-icon">🌤️</div>
                            </div>
                            <div class="j-w-row-sub">
                                <div class="j-w-stat"><span class="j-w-lbl">COND</span><span id="w-cond">---</span></div>
                                <div class="j-w-stat"><span class="j-w-lbl">RANGE</span><span id="w-range">-- / --</span></div>
                                <div class="j-w-stat"><span class="j-w-lbl">RAIN</span><span id="w-rain">--%</span></div>
                                <div class="j-w-stat"><span class="j-w-lbl">SUNSET</span><span id="w-sunset">--:--</span></div>
                            </div>
                        </div>
                        <div class="j-w-nav">
                            <button type="button" class="j-w-btn active" data-loc="takamatsu">高松</button>
                            <button type="button" class="j-w-btn" data-loc="matsuyama">松山</button>
                            <button type="button" class="j-w-btn" data-loc="imabari">今治</button>
                        </div>
                    </div>
                </section>

                <!-- Live Schedule Advisor -->
                <section class="l-container" style="margin-top: 20px;">
                    <div class="j-advisor">
                        <div class="j-advisor-header">
                            <div class="j-advisor-title">LIVE SCHEDULE ADVISOR</div>
                            <div class="j-advisor-badge" id="adv-badge">STANDBY</div>
                        </div>
                        <div class="j-advisor-body">
                            <p class="j-advisor-desc" id="adv-desc">NOW MODEを有効にすると、現在の進行状況に応じたアドバイスが表示されます。</p>
                            <div class="j-advisor-row-btn" id="adv-actions" style="display: none;">
                                <button type="button" class="j-btn action-now-dept" id="btn-now-dept">DEPARTURE NOW</button>
                                <button type="button" class="j-btn-sub action-now-skip" id="btn-now-skip">SKIP SPOTS</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Leaflet Interactive Map View -->
                <section class="l-container" style="margin-top: 20px;">
                    <div class="j-map-frame">
                        <div id="map" class="j-map-inner"></div>
                        <button type="button" class="j-map-btn" id="btn-toggle-follow" style="display: none;">
                            <span class="j-map-btn-dot"></span>NOW TRACKING
                        </button>
                    </div>
                </section>

                <!-- Main Travel Content Navigation Tabs -->
                <div class="l-container" style="margin-top: 30px;">
                    <nav class="j-tabs-wrapper">
                        <div class="j-tabs-nav" role="tablist">
                            ${tabHeaders}
                            <button type="button" role="tab" aria-selected="false" aria-controls="tab-checklist" class="j-tab-lnk">CHECK</button>
                            <button type="button" role="tab" aria-selected="false" aria-controls="tab-paypay" class="j-tab-lnk">PAY</button>
                        </div>
                    </nav>

                    <!-- Days Content Panels -->
                    ${tabPanels}

                    <!-- Packing Checklist Tab Panel -->
                    <div id="tab-checklist" role="tabpanel" class="j-tab-pnl">
                        <div class="j-checklist-card">
                            <div class="j-chk-header">
                                <h3 class="j-chk-title">PACKING CHECKLIST</h3>
                                <p class="j-chk-desc">出発前夜と当日の朝に最終チェック！</p>
                            </div>
                            <div class="j-chk-body">
                                ${checklistHtml}
                            </div>
                        </div>
                    </div>

                    <!-- PayPay Group Split Tab Panel -->
                    <div id="tab-paypay" role="tabpanel" class="j-tab-pnl">
                        <div class="j-warikan-card">
                            <div class="j-warikan-header">
                                <h3 class="j-warikan-title">PAYPAY GROUP BILL</h3>
                                <div class="j-warikan-total">
                                    <div class="j-warikan-total-lbl">お互いの支払合計</div>
                                    <div class="j-warikan-total-val" id="warikan-ratio">あおい 0円 : こうたろう 0円</div>
                                </div>
                                <div class="j-warikan-result" id="warikan-result">精算: --</div>
                            </div>
                            <div class="j-warikan-body">
                                <form class="j-warikan-form" id="expense-form">
                                    <div class="j-form-group">
                                        <label for="exp-title" class="j-form-lbl">支出項目</label>
                                        <input type="text" id="exp-title" class="j-form-input" placeholder="例: うどんバカ一代, ガソリン代" required>
                                    </div>
                                    <div class="j-form-group">
                                        <label for="exp-amount" class="j-form-lbl">金額 (円)</label>
                                        <input type="number" id="exp-amount" class="j-form-input" placeholder="金額を入力してください" required>
                                    </div>
                                    <div class="j-form-group">
                                        <label class="j-form-lbl">支払った人</label>
                                        <div class="j-radio-group">
                                            <label class="j-radio-lbl">
                                                <input type="radio" name="exp-payer" value="aoi" checked>
                                                <span class="j-radio-btn">あおい</span>
                                            </label>
                                            <label class="j-radio-lbl">
                                                <input type="radio" name="exp-payer" value="kotaro">
                                                <span class="j-radio-btn">こうたろう</span>
                                            </label>
                                        </div>
                                    </div>
                                    <button type="submit" class="j-btn-submit">支出を追加する</button>
                                </form>

                                <div class="j-expense-list">
                                    <div class="j-list-header">
                                        <div class="j-list-title">最近の支出</div>
                                        <button type="button" class="j-list-clear" id="btn-clear-expenses">履歴をリセット</button>
                                    </div>
                                    <div class="j-list-body" id="expense-list-container">
                                        <div class="j-list-empty">登録された支出はありません。</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Network Offline Status Floating Bar -->
                <div class="j-offline-bar" id="offline-status">ONLINE</div>
            `;
        }
    </script>
</body>
</html>
